name: chefvision
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+16

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_image_labeling: ^0.16.1
  purchases_flutter: ^10.17.0
  firebase_core: ^4.6.0
  firebase_ai: ^4.0.0
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^3.0.0
  camera: ^0.12.0+1
  image_picker: ^1.1.2
  google_mobile_ads: ^9.0.0
  envied: ^1.0.0
  firebase_crashlytics: ^5.1.0
  firebase_remote_config: ^6.3.0
  firebase_analytics: ^12.2.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  json_annotation: ^4.12.0
  freezed: ^4.0.3
  freezed_annotation: ^3.1.0
  easy_localization: ^3.0.8
  go_router: ^18.1.0
  cupertino_icons: ^2.0.0
  firebase_ml_model_downloader: ^0.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_gen: ^5.14.1
  flutter_svg: ^2.3.0
  collection: ^1.19.1
  dotted_border: ^3.1.0
  url_launcher: ^6.3.2
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  envied_generator: ^1.0.0
  injectable_generator: ^3.1.3
  json_serializable: ^6.13.1
  flutter_gen_runner: ^5.14.1

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/logo/
    - assets/translations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Italic.ttf
        - asset: assets/fonts/Inter/Inter-Regular.ttf


flutter_gen:
  output: lib/resources/gen
  line_length: 120
  integrations:
    flutter_svg: true
